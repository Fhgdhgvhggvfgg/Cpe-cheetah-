<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> game of runner cheetah</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0f0f0f;
            color: white;
            font-family: Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
            position: fixed;
        }

        h1 {
            margin: 5px 0;
            font-size: 18px;
        }

        #game-container {
            position: relative;
            width: 440px;
            height: 680px;
            min-width: 440px;
            min-height: 680px;
            background: #222;
            border: 4px solid #fff;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
            border-radius: 12px;
            flex-shrink: 0;
            transform-origin: center center;
            transition: transform 0.2s ease;
        }

#white-box-icon {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 75px;
    height: 75px;
    background-image: url('player_jump.png'); /* تم التغيير هنا */
    background-size: 200% 400%;  /* تم تعديل الارتفاع ليناسب 1024 عمودي */
    background-position: 100% 100%;
    z-index: 15;
    border-radius: 4px;
}


        .lane-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(255, 255, 255, 0.2);
            z-index: 1;
        }
        #line1 { left: 146px; }
        #line2 { left: 293px; }

        .obstacle {
            position: absolute;
            width: 65px;
            height: 65px;
            background: #ff3366;
            border-radius: 10px;
            box-shadow: 0 0 12px #ff3366;
            z-index: 2;
        }

        .enemy-yellow {
            position: absolute;
            width: 60px;
            height: 60px;
            background: #ffcc00;
            border-radius: 50%;
            box-shadow: 0 0 12px #ffcc00;
            z-index: 2;
        }

        .obstacle-line {
            position: absolute;
            width: 420px;
            height: 12px;
            background: #f4b446;
            box-shadow: 0 0 10px #f4b446;
            border-radius: 6px;
            z-index: 12;
        }

        #player-container {
            position: absolute;
            bottom: 170px;
            width: 65px;
            height: 65px;
            transition: bottom 0.3s ease-in, left 0.12s ease-out;
            z-index: 10;
        }

        #shadow {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 65px;
            height: 15px;
            background: rgba(0, 150, 255, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0, 150, 255, 0.8);
        }

#player {
    position: absolute;
    bottom: 8px; 
    left: -30px;  
    width: 135px;
    height: 135px;
    background-image: url('player_jump.png'); /* تم التغيير هنا */
    background-size: 200% 400%;  /* تم تعديل الارتفاع */
    background-position: 0% 0%;
    border-radius: 0px;
    box-shadow: none;
    transition: transform 0.45s cubic-bezier(0, 0, 0.58, 1);
}


        #ui {
            margin-top: 8px;
            font-size: 16px;
            font-weight: bold;
        }
        
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            text-align: center;
        }

#start-player-preview {
    width: 180px;
    height: 180px;
    background-image: url('player_jump.png'); /* تم التغيير هنا */
    background-size: 200% 400%;  /* تم تعديل الارتفاع */
    background-position: 100% 100%;
    margin-bottom: 20px;
    border-radius: 8px;
}


        #start-screen h2 {
            margin-bottom: 20px;
            font-size: 22px;
            color: #fff;
        }

        #start-screen button {
            padding: 12px 30px;
            font-size: 18px;
            background: #00ffcc;
            color: #000;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,255,204,0.5);
            margin-top: 10px;
        }

        /* حاوية أزرار التحكم بالحجم */
        .zoom-buttons-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .zoom-buttons-container button {
            padding: 10px 20px;
            font-size: 18px;
            background: #333;
            color: #fff;
            border: 2px solid #fff;
            cursor: pointer;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 0 !important;
        }

        #character-select-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 40;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #character-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 350px;
            overflow-y: auto;
            width: 100%;
            align-items: center;
            margin-bottom: 15px;
        }

        .character-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 8px;
            width: 80%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .character-item:hover {
            border-color: #00ffcc;
        }

        .character-preview-img {
            width: 50px;
            height: 50px;
            background-size: 200% 400%;  /* تم التعديل لتناسب الابعاد العمودية الجديدة */
            background-position: 100% 100%; /* عرض الشخصية الثابتة في القائمة (الصورة الرابعة مثلاً) */
            border-radius: 6px;
            margin-left: 15px;
            flex-shrink: 0;
        }


        .character-name {
            font-size: 14px;
            word-break: break-all;
            text-align: right;
            color: #fff;
        }

        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 20px 30px;
            text-align: center;
            border: 2px solid #fff;
            border-radius: 10px;
            z-index: 20;
        }
        #game-over button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            background: #00ffcc;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            display: block;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>لعبة المسارات (توقيت زمني ثابت)</h1>
    
    <div id="game-container">
        <div id="start-screen">
            <div id="start-player-preview"></div>
            <h2>لعبة تفادي العوائق</h2>
            <button onclick="startGame()">ابدأ اللعب</button>
            <button onclick="openCharacterSelect()" style="background: #ffcc00;">اختر الشخصية</button>
            
            <!-- أزرار التحكم بالحجم (+ و -) -->
            <div class="zoom-buttons-container">
                <button onclick="zoomGame(0.1)">+</button>
                <button onclick="zoomGame(-0.1)">-</button>
            </div>
        </div>

        <div id="character-select-screen">
            <h2>اختر شخصية اللاعب</h2>
            <div id="character-list"></div>
            <input type="file" id="device-image-input" accept="image/*" style="display: none;" onchange="handleDeviceImage(event)">
<button onclick="document.getElementById('device-image-input').click()" style="background: #00ffcc; color: #000; margin-bottom: 10px;">اختر صورة من المعرض</button>

            <button onclick="closeCharacterSelect()" style="background: #ff3366; color: #fff;">رجوع</button>
        </div>

        <div id="white-box-icon"></div>

        <div class="lane-line" id="line1"></div>
        <div class="lane-line" id="line2"></div>

        <div id="player-container">
            <div id="shadow"></div>
            <div id="player"></div>
        </div>

        <div id="game-over">
            <h2>انتهت اللعبة!</h2>
            <p id="final-score">النقاط: 0</p>
            <button onclick="restartGame()">إعادة المحاولة</button>
            <button onclick="goToStartScreen()" style="background: #ffcc00; color: #000;">القائمة الرئيسية</button>
        </div>
    </div>

    <div id="ui">النقاط: <span id="score">0</span></div>
    <p style="font-size: 12px; color: #aaa; margin-top: 3px; text-align: center;">اسحب يميناً/يساراً للمسار | اسحب للأعلى للقفز | اسحب للأسفل للتصفير</p>

    <script>
           const playerContainer = document.getElementById('player-container');
        const player = document.getElementById('player');
        const gameContainer = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score');
        const gameOverScreen = document.getElementById('game-over');
        const startScreen = document.getElementById('start-screen');
        const characterSelectScreen = document.getElementById('character-select-screen');
        const characterListContainer = document.getElementById('character-list');
        const startPlayerPreview = document.getElementById('start-player-preview');
        const whiteBoxIcon = document.getElementById('white-box-icon');
        const finalScoreDisplay = document.getElementById('final-score');

let currentPlayerImage = localStorage.getItem('selectedPlayerImage') || 'player_jump.png';

        applyPlayerImage(currentPlayerImage);

        let currentScale = parseFloat(localStorage.getItem('gameScale')) || 1.0;
        updateGameScale();

        function zoomGame(amount) {
            currentScale += amount;
            if (currentScale < 0.6) currentScale = 0.6;
            if (currentScale > 2.0) currentScale = 2.0;
            currentScale = Math.round(currentScale * 10) / 10;
            localStorage.setItem('gameScale', currentScale);
            updateGameScale();
        }

        function updateGameScale() {
            gameContainer.style.transform = `scale(${currentScale})`;
        }

        const lanes = [320, 185, 50]; 
        let currentLane = 1; 
        let score = 0;
        let isGameStarted = false;
        let isGameOver = false;
        let isJumping = false;
        let obstacles = [];
        let yellowEnemies = [];
        let triangles = []; 
        
        let gameSpeed = 450; 
        let spawnAccumulator = 0;
        let yellowSpawnAccumulator = 0;
        let nextYellowSpawnTime = getRandomYellowTime();
        let triangleSpawnAccumulator = 0;
        let nextTriangleSpawnTime = getRandomTriangleTime();

        let animTimer = 0;
        let runFrame = 0;
        let gameAnimId = null;
        let lastTime = 0;

        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;

        updatePlayerPosition();

        document.addEventListener('keydown', (e) => {
            if (!isGameStarted || isGameOver) return;
            if (e.key === 'ArrowRight') {
                moveRight();
            } else if (e.key === 'ArrowLeft') {
                moveLeft();
            } else if (e.key === 'ArrowUp') {
                jump();
            } else if (e.key === 'ArrowDown') {
                resetJumpCounters();
            }
        });

        gameContainer.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        gameContainer.addEventListener('touchend', (e) => {
            if (!isGameStarted || isGameOver) return;
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            handleGesture();
        }, { passive: true });

        // تم إعادة إضافة دالة handleGesture لتصحيح الخطأ البرمجي
        function handleGesture() {
            let diffX = touchEndX - touchStartX;
            let diffY = touchEndY - touchStartY;
            let threshold = 30;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > threshold) {
                    if (diffX < 0) {
                        moveLeft();
                    } else {
                        moveRight();
                    }
                }
            } else {
                if (Math.abs(diffY) > threshold) {
                    if (diffY < 0) {
                        jump();
                    } else {
                        resetJumpCounters();
                    }
                }
            }
        }

        function resetJumpCounters() {
            isJumping = false;
            player.style.backgroundPosition = (runFrame === 0 ? '0% 0%' : '-100% 0%');tyle.transition = 'none';
            player.style.transform = 'translateY(0)';
            player.style.backgroundPosition = (runFrame === 0 ? '0% 0%' : '-100% 0%');            
            
            setTimeout(() => {
                player.style.transition = 'transform 0.45s cubic-bezier(0, 0, 0.58, 1)';
            }, 50);
        }

        function startGame() {
            startScreen.style.display = 'none';
            isGameStarted = true;
            lastTime = performance.now();
            gameAnimId = requestAnimationFrame(updateGame);
        }

        // دالة فتح قائمة الشخصيات ودمج صور المعرض المحفوظة داخل القائمة
        // دالة فتح قائمة الشخصيات وعرض زر الحذف بجانب صور المعرض فقط
        async function openCharacterSelect() {
            startScreen.style.display = 'none';
            characterSelectScreen.style.display = 'flex';
            characterListContainer.innerHTML = 'جاري التحميل...';

            try {
                const response = await fetch('player_t.txt');
                const text = await response.text();
                let images = text.split('\n').map(item => item.trim()).filter(item => item.length > 0);

                let customImages = JSON.parse(localStorage.getItem('customPlayerImages')) || [];
                images = [...customImages, ...images];

                characterListContainer.innerHTML = '';
                images.forEach(imgName => {
                    const item = document.createElement('div');
                    item.className = 'character-item';
                    // جعل العنصر يختار الشخصية عند النقر عليه (باستثناء زر الحذف)
                    item.onclick = (e) => {
                        if (!e.target.classList.contains('delete-btn')) {
                            selectCharacter(imgName);
                        }
                    };

                    const imgPreview = document.createElement('div');
                    imgPreview.className = 'character-preview-img';
                    imgPreview.style.backgroundImage = `url('${imgName}')`;

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'character-name';
                    nameSpan.style.flexGrow = '1';
                    nameSpan.textContent = imgName.startsWith('blob:') ? 'صورة من المعرض' : imgName;

                    item.appendChild(imgPreview);
                    item.appendChild(nameSpan);

                    // إضافة زر حذف بحافة مسطرة الشخصية إذا كانت الصورة مضافة من المعرض (تبدأ بـ blob:)
                    if (imgName.startsWith('blob:')) {
                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = 'delete-btn';
                        deleteBtn.textContent = '✕';
                        deleteBtn.style.cssText = 'background: #ff3366; color: #fff; border: none; border-radius: 4px; padding: 5px 10px; cursor: pointer; font-weight: bold; margin-right: 10px;';
                        deleteBtn.onclick = (e) => {
                            e.stopPropagation(); // منع تفعيل اختيار الشخصية عند النقر على زر الحذف
                            deleteCustomCharacter(imgName);
                        };
                        item.appendChild(deleteBtn);
                    }

                    characterListContainer.appendChild(item);
                });
            } catch (error) {
                characterListContainer.innerHTML = 'فشل تحميل ملف الشخصيات player_t.txt';
            }
        }

        // دالة حذف الشخصية المخصصة من الذاكرة وتحديث القائمة
        function deleteCustomCharacter(imgName) {
            let customImages = JSON.parse(localStorage.getItem('customPlayerImages')) || [];
            customImages = customImages.filter(img => img !== imgName);
            localStorage.setItem('customPlayerImages', JSON.stringify(customImages));

            // إذا كانت الشخصية المحذوفة هي الشخصية الحالية، نرجع للافتراضية
            if (currentPlayerImage === imgName) {
                currentPlayerImage = 'player_jump.png';
                localStorage.setItem('selectedPlayerImage', 'player_jump.png');
                applyPlayerImage('player_jump.png');
            }

            // إعادة تحميل القائمة لتحديث العناصر
            openCharacterSelect();
        }


        function closeCharacterSelect() {
            characterSelectScreen.style.display = 'none';
            startScreen.style.display = 'flex';
        }

        function selectCharacter(imgName) {
            currentPlayerImage = imgName;
            localStorage.setItem('selectedPlayerImage', imgName);
            applyPlayerImage(imgName);
            closeCharacterSelect();
        }

        // دالة اختيار وحفظ الصورة من المعرض لتصبح جزءاً من قائمة الشخصيات
        function handleDeviceImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const imagePath = URL.createObjectURL(file);

            let customImages = JSON.parse(localStorage.getItem('customPlayerImages')) || [];
            if (!customImages.includes(imagePath)) {
                customImages.push(imagePath);
                localStorage.setItem('customPlayerImages', JSON.stringify(customImages));
            }

            currentPlayerImage = imagePath;
            localStorage.setItem('selectedPlayerImage', imagePath);
            
            applyPlayerImage(imagePath);
            closeCharacterSelect();
        }

        function applyPlayerImage(imgName) {
            player.style.backgroundImage = `url('${imgName}')`;
            startPlayerPreview.style.backgroundImage = `url('${imgName}')`;
            whiteBoxIcon.style.backgroundImage = `url('${imgName}')`;
        }

        function goToStartScreen() {
            if (gameAnimId) {
                cancelAnimationFrame(gameAnimId);
                gameAnimId = null;
            }

            obstacles.forEach(obs => obs.remove());
            obstacles = [];
            yellowEnemies.forEach(yEnemy => yEnemy.remove());
            yellowEnemies = [];
            triangles.forEach(tri => tri.remove());
            triangles = [];

            score = 0;
            scoreDisplay.textContent = score;
            currentLane = 1;
            spawnAccumulator = 0;
            yellowSpawnAccumulator = 0;
            triangleSpawnAccumulator = 0;
            nextYellowSpawnTime = getRandomYellowTime();
            nextTriangleSpawnTime = getRandomTriangleTime();
            animTimer = 0;
            runFrame = 0;
            isJumping = false;
            isGameOver = false;
            isGameStarted = false;

            playerContainer.style.bottom = '170px';
            player.style.transform = 'translateY(0)';
            player.style.backgroundPosition = '0% 0%';
            updatePlayerPosition();

            gameOverScreen.style.display = 'none';
            startScreen.style.display = 'flex';
        }

        function jump() {
            if (isJumping) return;
            isJumping = true;
            
            player.style.transition = 'transform 0.3s cubic-bezier(0, 0, 0.2, 1)';
            player.style.transform = 'translateY(-110px)';
            player.style.backgroundPosition = '-100% 0%';
            
            setTimeout(() => {
                player.style.transition = 'transform 0.3s cubic-bezier(0.42, 0, 1, 1)';
                player.style.transform = 'translateY(0)';
                player.style.backgroundPosition = '0% 0%';
                
                setTimeout(() => {
                    isJumping = false;
                }, 200);
            }, 200);
        }

        function moveLeft() {
            if (currentLane < 2) {
                currentLane++;
                updatePlayerPosition();
            }
        }

        function moveRight() {
            if (currentLane > 0) {
                currentLane--;
                updatePlayerPosition();
            }
        }

        function updatePlayerPosition() {
            playerContainer.style.left = lanes[currentLane] + 'px';
        }

        function createObstacle() {
            const obstacle = document.createElement('div');
            obstacle.classList.add('obstacle');
            
            const randomLane = Math.floor(Math.random() * 3);
            obstacle.style.left = lanes[randomLane] + 'px';
            obstacle.style.top = '-60px';
            obstacle.dataset.lane = randomLane;
            
            gameContainer.appendChild(obstacle);
            obstacles.push(obstacle);
        }

        function getRandomYellowTime() {
            return Math.random() * 3 + 2; 
        }

        function getRandomTriangleTime() {
            return Math.random() * 5 + 4; 
        }

        function createYellowEnemy() {
            const enemy = document.createElement('div');
            enemy.classList.add('enemy-yellow');
            
            const randomLane = Math.floor(Math.random() * 3);
            let startX = lanes[randomLane];
            enemy.style.left = startX + 'px';
            enemy.style.top = '-60px';
            
            enemy.dataset.x = startX;
            enemy.direction = Math.random() < 0.5 ? 1 : -1;
            
            gameContainer.appendChild(enemy);
            yellowEnemies.push(enemy);
        }

        function createTriangle() {
            const line = document.createElement('div');
            line.classList.add('obstacle-line');
            
            line.style.left = '10px';
            line.style.top = '-60px';
            
            gameContainer.appendChild(line);
            triangles.push(line);
        }

        function updateGame(currentTime) {
            if (!isGameStarted || isGameOver) return;

            let deltaTime = (currentTime - lastTime) / 1000; 
            if (deltaTime > 0.1) deltaTime = 0.1; 
            lastTime = currentTime;

            if (!isJumping) {
                animTimer += deltaTime;
                if (animTimer > 0.16) {
                    runFrame = 1 - runFrame;
                    player.style.backgroundPosition = (runFrame === 0 ? '0% 0%' : '-100% 0%');
                    animTimer = 0;
                }
            }

            spawnAccumulator += deltaTime;
            if (spawnAccumulator > 0.9) {
                createObstacle();
                spawnAccumulator = 0;
                gameSpeed += 2; 
            }

            yellowSpawnAccumulator += deltaTime;
            if (yellowSpawnAccumulator >= nextYellowSpawnTime) {
                createYellowEnemy();
                yellowSpawnAccumulator = 0;
                nextYellowSpawnTime = getRandomYellowTime();
            }

            triangleSpawnAccumulator += deltaTime;
            if (triangleSpawnAccumulator >= nextTriangleSpawnTime) {
                createTriangle();
                triangleSpawnAccumulator = 0;
                nextTriangleSpawnTime = getRandomTriangleTime();
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                let currentTop = parseFloat(obs.style.top);
                currentTop += gameSpeed * deltaTime;
                obs.style.top = currentTop + 'px';

                let obsLane = parseInt(obs.dataset.lane);
                let obsHeight = obs.offsetHeight;
                let playerY = 390;

                if (currentTop >= playerY && currentTop <= playerY + obsHeight && obsLane === currentLane) {
                    if (!isJumping) {
                        endGame();
                        return;
                    }
                }

                if (currentTop > 680) {
                    obs.remove();
                    obstacles.splice(i, 1);
                    score += 10;
                    scoreDisplay.textContent = score;
                }
            }

            for (let i = yellowEnemies.length - 1; i >= 0; i--) {
                let yEnemy = yellowEnemies[i];
                let currentTop = parseFloat(yEnemy.style.top);
                currentTop += (gameSpeed * 0.8) * deltaTime;
                yEnemy.style.top = currentTop + 'px';

                let currentX = parseFloat(yEnemy.dataset.x);
                currentX += yEnemy.direction * 90 * deltaTime;

                if (currentX > 370) {
                    currentX = 370;
                    yEnemy.direction = -1;
                } else if (currentX < 10) {
                    currentX = 10;
                    yEnemy.direction = 1;
                }
                yEnemy.dataset.x = currentX;
                yEnemy.style.left = currentX + 'px';

                let playerX = lanes[currentLane];
                let playerY = 460;
                let enemyWidth = yEnemy.offsetWidth;
                let enemyHeight = yEnemy.offsetHeight;

                let hitRadiusX = enemyWidth * 0.75;
                let hitRadiusY = enemyHeight * 0.75;

                if (Math.abs(currentTop - playerY) < hitRadiusY && Math.abs(currentX - playerX) < hitRadiusX) {
                    if (!isJumping) {
                        endGame();
                        return;
                    }
                }

                if (currentTop > 680) {
                    yEnemy.remove();
                    yellowEnemies.splice(i, 1);
                    score += 15;
                    scoreDisplay.textContent = score;
                }
            }

            for (let i = triangles.length - 1; i >= 0; i--) {
                let tri = triangles[i];
                let currentTop = parseFloat(tri.style.top);
                currentTop += gameSpeed * deltaTime;
                tri.style.top = currentTop + 'px';

                if (currentTop >= 390 && currentTop <= 470) {
                    if (isJumping) { 
                        endGame();
                        return;
                    }
                }

                if (currentTop > 680) {
                    tri.remove();
                    triangles.splice(i, 1);
                    score += 20; 
                    scoreDisplay.textContent = score;
                }
            }

            gameAnimId = requestAnimationFrame(updateGame);
        }

        function dropPlayerOnDeath() {
            playerContainer.style.bottom = '90px';
        }

        function endGame() {
            if (isGameOver) return;
            isGameOver = true;
            
            player.style.backgroundPosition = '0% 100%';
            dropPlayerOnDeath();
            
            if (gameAnimId) {
                cancelAnimationFrame(gameAnimId);
                gameAnimId = null;
            }
            
            setTimeout(() => {
                finalScoreDisplay.textContent = "النقاط: " + score;
                gameOverScreen.style.display = 'block';
            }, 1000);
        }

        function restartGame() {
            if (gameAnimId) {
                cancelAnimationFrame(gameAnimId);
                gameAnimId = null;
            }

            gameSpeed = 450; 
            obstacles.forEach(obs => obs.remove());
            obstacles = [];
            yellowEnemies.forEach(yEnemy => yEnemy.remove());
            yellowEnemies = [];
            triangles.forEach(tri => tri.remove());
            triangles = [];

            score = 0;
            scoreDisplay.textContent = score;
            currentLane = 1;
            spawnAccumulator = 0;
            yellowSpawnAccumulator = 0;
            triangleSpawnAccumulator = 0;
            nextYellowSpawnTime = getRandomYellowTime();
            nextTriangleSpawnTime = getRandomTriangleTime();
            animTimer = 0;
            runFrame = 0;
            isJumping = false;
            isGameOver = false;
            
            playerContainer.style.bottom = '170px';
            player.style.transform = 'translateY(0)';
            player.style.backgroundPosition = '0% 0%';
            updatePlayerPosition();
            gameOverScreen.style.display = 'none';
            
            isGameStarted = true;
            lastTime = performance.now();
            gameAnimId = requestAnimationFrame(updateGame);
        }

        
    </script>
</body>
</html>
