        .lane-line { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(255, 255, 255, 0.2); z-index: 1; }

        #player-container { position: absolute; bottom: 170px; width: 65px; height: 65px; transition: bottom 0.3s ease-in, left 0.12s ease-out; z-index: 10; }

#start-player-preview {

}

}

        <div id="powerup-status">مواجهة البوس <span id="timer-count">20</span>ث</div>

        <div id="start-screen">
            <div id="start-player-preview"></div>
            <h2>السحب اعلى اسفل يمين يسار</h2>

            <div style="font-size: 16px; color: #ffcc00; margin: 10px 0; font-weight: bold;">
    أعلى نقاط: <span id="highest-score">0</span>
</div>

            <button onclick="startGame()" style="background: #00ffcc; color: #000;">ابدأ اللعب</button>

        </div>

        <div id="game-over">
            <h2>انتهت اللعبة!</h2>

            <button onclick="restartGame()" style="background: #00ffcc; color: #000;">إعادة المحاولة</button>
            <button onclick="goToStartScreen()" style="background: #ffcc00; color: #000;">القائمة الرئيسية</button>

    <script>
        const charManager = new CharacterManager();
        let currentBoss = null; // متغير عام لتخزين كائن الزعيم الحالي باستخدام اسم الكلاس مستقبلاً

        const playerContainer = document.getElementById('player-container');
        const player = document.getElementById('player');
        const gameContainer = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score');
        const gameOverScreen = document.getElementById('game-over');
        const startScreen = document.getElementById('start-screen');
        const characterSelectScreen = document.getElementById('character-select-screen');
        const startPlayerPreview = document.getElementById('start-player-preview');
        const whiteBoxIcon = document.getElementById('white-box-icon');
        const finalScoreDisplay = document.getElementById('final-score');
        const powerupStatus = document.getElementById('powerup-status');
        const timerCount = document.getElementById('timer-count');
this.bossToggle = 3;
        updateSelectedPlayer(charManager.currentPlayerImage);

        let currentScale = parseFloat(localStorage.getItem('gameScale')) || 1.0;
        updateGameScale();

    let com = 1;

    if (com === 1) {
        const s = document.createElement('script');
        s.src = 'mascot.js';
        document.head.appendChild(s);
    }

function updateGscoreProgressBar() {
    let progressBar = document.getElementById('score-progress-bar');
    if (!progressBar) return;

 // القيمة الابتدائية
    // مقارنة السكور العادي بـ gscore وحساب النسبة المئوية للزيادة
    let currentProgress = score - gscore;
    let percentage = Math.min((currentProgress / 400) * 100, 100);
    percentage = Math.max(percentage, 0);

    // تطبيق النسبة ليزداد الخط الأخضر تدريجياً مع زيادة النقاط
    progressBar.style.width = percentage + '%';
}


// دالة لتحديث وعرض أعلى نقاط عند نهاية اللعبة أو بدايتها
function checkAndUpdateHighScore(currentScore) {
    // جلب أعلى نقاط مخزنة مسبقاً، وإذا لم توجد تكون القيمة 0
    let highScore = localStorage.getItem('gameHighScore') || 0;

    // مقارنة النقاط الحالية مع أعلى نقاط مسجلة
    if (currentScore > highScore) {
        highScore = currentScore;
        // تخزين الرقم الجديد كأعلى نقاط
        localStorage.setItem('gameHighScore', highScore);
    }

    return highScore;
}


        function zoomGame(amount) {
            currentScale = Math.min(Math.max(currentScale + amount, 0.6), 2.0);
            currentScale = Math.round(currentScale * 10) / 10;
            localStorage.setItem('gameScale', currentScale);
            updateGameScale();
        }

        function updateGameScale() {
        document.getElementById('highest-score').textContent = localStorage.getItem('gameHighScore') || 0;

            gameContainer.style.transform = `scale(${currentScale})`;
        }

        function updateSelectedPlayer(imgName) {
            charManager.applyPlayerImage(imgName, player, startPlayerPreview, whiteBoxIcon);
            closeCharacterSelect();
        }

        function openCharacterSelectMenu() {
            startScreen.style.display = 'none';
            characterSelectScreen.style.display = 'flex';
            charManager.openCharacterSelect('character-list', (imgName) => {
                updateSelectedPlayer(imgName);
            });
        }

// دالة تحديث الشريط بناءً على الفرق بين السكور العادي و gscore
function updateGscoreProgressBar() {
    let progressBar = document.getElementById('score-progress-bar');
    if (!progressBar) return;

    let currentProgress = score - gscore;
    let percentage = Math.min((currentProgress / 400) * 100, 100);
    percentage = Math.max(percentage, 0);

    progressBar.style.width = percentage + '%';
}

// دالة التصفير المشروطة بالوصول إلى 400 نقطة
function resetGscore() {
    let currentProgress = score - gscore;
    
    // التحقق مما إذا كان الشريط قد وصل إلى حده الأقصى (400 نقطة أو أكثر)
    if (currentProgress >= 400) {

        gscore = score; // تصفير أو إعادة ضبط نقطة البداية للشريط
        updateGscoreProgressBar(); // تحديث شكل الشريط ليعود للصفر
    }
}



        function closeCharacterSelect() {
            characterSelectScreen.style.display = 'none';
            startScreen.style.display = 'flex';
        }

        const lanes = [320, 185, 50]; 
        let currentLane = 1; 
        let score = 0;
        let gscore = 0;
        let isGameStarted = false, isGameOver = false, isJumping = false;
        let obstacles = [], yellowEnemies = [], triangles = [], blueCircles = []; 
        let gameSpeed = 450, spawnAccumulator = 0, yellowSpawnAccumulator = 0;
        let nextYellowSpawnTime = getRandomYellowTime(), triangleSpawnAccumulator = 0;
        let nextTriangleSpawnTime = getRandomTriangleTime();
        
        let blueCircleSpawnAccumulator = 0;
        let nextBlueCircleSpawnTime = getRandomBlueCircleTime();
        let isShieldActive = false;
        let shieldTimer = 0;

        let animTimer = 0, runFrame = 0, gameAnimId = null, lastTime = 0;
        let touchStartX = 0, touchStartY = 0, touchEndX = 0, touchEndY = 0;

        updatePlayerPosition();

        document.addEventListener('keydown', (e) => {
            if (!isGameStarted || isGameOver) return;
            if (e.key === 'ArrowRight') moveRight();
            else if (e.key === 'ArrowLeft') moveLeft();
            else if (e.key === 'ArrowUp') jump();
            else if (e.key === 'ArrowDown') resetJumpCounters();
        });

        gameContainer.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        gameContainer.addEventListener('touchend', (e) => {
            if (!isGameStarted || isGameOver) return;
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            handleGesture();
        }, { passive: true });

        function handleGesture() {
            let diffX = touchEndX - touchStartX;
            let diffY = touchEndY - touchStartY;
            let threshold = 30;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > threshold) {
                    diffX < 0 ? moveLeft() : moveRight();
                }
            } else {
                if (Math.abs(diffY) > threshold) {
                    diffY < 0 ? jump() : resetJumpCounters();
                }
            }
        }

        function resetJumpCounters() {
            isJumping = false;
            player.style.transition = 'none';
            player.style.transform = 'translateY(0)';
            player.style.backgroundPosition = (runFrame === 0 ? '0% 0%' : '-100% 0%');            
            setTimeout(() => {
                player.style.transition = 'transform 0.45s cubic-bezier(0, 0, 0.58, 1)';
            }, 50);
        }

        function startGame() {
            startScreen.style.display = 'none';
            document.getElementById('reset-gscore-btn').style.display = 'block';
            
            isGameStarted = true;
            lastTime = performance.now();
            gameAnimId = requestAnimationFrame(updateGame);
        }

        function jump() {
            if (isJumping) return;
            isJumping = true;
            let num = Math.floor(Math.random() * 10) + 1;
            let bgPos = num < 4 ? '-100% 200%' : '-100% 0%';
            
            player.style.transition = 'transform 0.8s cubic-bezier(0, 0, 0.2, 1)';
            player.style.transform = 'translateY(-110px)';
            player.style.backgroundPosition = bgPos;
            
            setTimeout(() => {
                if (!isJumping) return;
                player.style.transition = 'transform 0.2s cubic-bezier(0.42, 0, 1, 1)';
                player.style.transform = 'translateY(0)';
                player.style.backgroundPosition = '0% 0%';
                setTimeout(() => { isJumping = false; }, 200);
            }, 500);
        }

        function moveLeft() { if (currentLane < 2) { currentLane++; updatePlayerPosition(); } }
        function moveRight() { if (currentLane > 0) { currentLane--; updatePlayerPosition(); } }
        function updatePlayerPosition() { playerContainer.style.left = lanes[currentLane] + 'px'; }

        function getRandomYellowTime() { return Math.random() * 3 + 2; }
        function getRandomTriangleTime() { return Math.random() * 5 + 4; }
        function getRandomBlueCircleTime() { return Math.random() * 12 + 10; }

        function createObstacle() {
            const obstacle = document.createElement('div');
            obstacle.classList.add('obstacle');
            const randomLane = Math.floor(Math.random() * 3);
            obstacle.style.left = lanes[randomLane] + 'px';
            obstacle.style.top = '-60px';
            obstacle.dataset.lane = randomLane;
            gameContainer.appendChild(obstacle);
            obstacles.push(obstacle);
        }

        function createYellowEnemy() {
            const enemy = document.createElement('div');
            enemy.classList.add('enemy-yellow');
            const randomLane = Math.floor(Math.random() * 3);
            let startX = lanes[randomLane];
            enemy.style.left = startX + 'px';
            enemy.style.top = '-60px';
            enemy.dataset.x = startX;
            enemy.direction = Math.random() < 0.5 ? 1 : -1;
            gameContainer.appendChild(enemy);
            yellowEnemies.push(enemy);
        }

        function createTriangle() {
            const line = document.createElement('div');
            line.classList.add('obstacle-line');
            line.style.left = '10px';
            line.style.top = '-60px';
            gameContainer.appendChild(line);
            triangles.push(line);
        }

        function createBlueCircle() {
            const circle = document.createElement('div');
            circle.classList.add('blue-circle');
            const randomLane = Math.floor(Math.random() * 3);
            circle.style.left = (lanes[randomLane] + 7) + 'px'; 
            circle.style.top = '-50px';
            circle.dataset.lane = randomLane;
            gameContainer.appendChild(circle);
            blueCircles.push(circle);
        }

let bossToggle = 1; // متغير خارجي للتناوب بين الزعماء (يمكنك جعله عشوائياً أيضاً)

function activateShield() {
    isShieldActive = true;
    shieldTimer = 20;
    powerupStatus.style.display = 'block';
    timerCount.textContent = shieldTimer;
    
    // إزالة هالة الدرع عن اللاعب (لا يوجد player.style.filter)

    // استدعاء الزعيم بالتناوب بناءً على قيمة bossToggle
// تعديل متغير التبديل ليشمل الزعماء الثلاثة


if (!currentBoss) {
    if (this.bossToggle === 1) {
        currentBoss = new GameBoss(gameContainer, () => currentLane, () => lanes[currentLane], () => endGame(), () => isJumping);
        this.bossToggle = 2;
    } else if (this.bossToggle === 2) {
        currentBoss = new GameBoss2(gameContainer, () => currentLane, () => lanes[currentLane], () => endGame(), () => isJumping);
        this.bossToggle = 3;
    } else if (this.bossToggle === 3) {
        currentBoss = new GameBoss3(gameContainer, () => currentLane, () => lanes[currentLane], () => endGame(), () => isJumping);
        this.bossToggle = 4;
    } else {
        currentBoss = new GameBoss4(gameContainer, () => currentLane, () => lanes[currentLane], () => endGame(), () => isJumping);
        this.bossToggle = 1; // العودة للزعيم الأول
    }
}




    // مسح الأعداء والعوائق الحالية من الشاشة
    [obstacles, yellowEnemies, triangles, blueCircles].forEach(arr => {
        arr.forEach(el => el.remove());
        arr.length = 0;
    });

    let countdownInterval = setInterval(() => {
        shieldTimer--;
        timerCount.textContent = shieldTimer;
        if (shieldTimer <= 0 || isGameOver) {
            clearInterval(countdownInterval);
            isShieldActive = false;
            powerupStatus.style.display = 'none';
            
            // تدمير الزعيم الحالي وإضافة 500 نقطة
            if (currentBoss) {
                currentBoss.destroy();
                currentBoss = null;

                // إضافة النقاط وتحديث واجهة المستخدم
                score += 500;
                if (scoreElement) {
                    scoreElement.textContent = score;
                }
            }

            blueCircleSpawnAccumulator = 0; 
            nextBlueCircleSpawnTime = getRandomBlueCircleTime();
        }
    }, 1000);
}


        function updateGame(currentTime) {
            if (!isGameStarted || isGameOver) return;
updateGscoreProgressBar();
            let deltaTime = (currentTime - lastTime) / 1000; 
            if (deltaTime > 0.1) deltaTime = 0.1; 
            lastTime = currentTime;            

            // تحديث الزعيم الحالي في كل إطار (Frame) برمجياً عبر اسم الكلاس/المتجر العام
            if (currentBoss) currentBoss.update(deltaTime);

            if (!isJumping) {
                animTimer += deltaTime;
                if (animTimer > 0.16) {
                    runFrame = 1 - runFrame;
                    player.style.backgroundPosition = (runFrame === 0 ? '0% 0%' : '-100% 0%');
                    animTimer = 0;
                }
            }

            if (!isShieldActive) {
                spawnAccumulator += deltaTime;
                if (spawnAccumulator > 0.9) {
                    createObstacle();
                    spawnAccumulator = 0;
                    gameSpeed += 0.1; 
                }

                yellowSpawnAccumulator += deltaTime;
                if (yellowSpawnAccumulator >= nextYellowSpawnTime) {
                    createYellowEnemy();
                    yellowSpawnAccumulator = 0;
                    nextYellowSpawnTime = getRandomYellowTime();
                }

                triangleSpawnAccumulator += deltaTime;
                if (triangleSpawnAccumulator >= nextTriangleSpawnTime) {
                    createTriangle();
                    triangleSpawnAccumulator = 0;
                    nextTriangleSpawnTime = getRandomTriangleTime();
                }

                blueCircleSpawnAccumulator += deltaTime;
                if (blueCircleSpawnAccumulator >= nextBlueCircleSpawnTime) {
                    createBlueCircle();
                    blueCircleSpawnAccumulator = 0;
                    nextBlueCircleSpawnTime = getRandomBlueCircleTime();
                }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                let currentTop = parseFloat(obs.style.top) + gameSpeed * deltaTime;
                obs.style.top = currentTop + 'px';

                if (!isShieldActive && currentTop >= 390 && currentTop <= 455 && parseInt(obs.dataset.lane) === currentLane) {
                    if (!isJumping) { endGame(); return; }
                }
                if (currentTop > 680) { obs.remove(); obstacles.splice(i, 1); score += 10; scoreDisplay.textContent = score; }
            }

            for (let i = yellowEnemies.length - 1; i >= 0; i--) {
                let yEnemy = yellowEnemies[i];
                let currentTop = parseFloat(yEnemy.style.top) + (gameSpeed * 0.8) * deltaTime;
                yEnemy.style.top = currentTop + 'px';

                let currentX = parseFloat(yEnemy.dataset.x) + yEnemy.direction * 90 * deltaTime;
                if (currentX > 370) { currentX = 370; yEnemy.direction = -1; }
                else if (currentX < 10) { currentX = 10; yEnemy.direction = 1; }
                yEnemy.dataset.x = currentX;
                yEnemy.style.left = currentX + 'px';

                if (!isShieldActive && Math.abs(currentTop - 460) < 45 && Math.abs(currentX - lanes[currentLane]) < 45) {
                    if (!isJumping) { endGame(); return; }
                }
                if (currentTop > 680) { yEnemy.remove(); yellowEnemies.splice(i, 1); score += 15; scoreDisplay.textContent = score; }
            }

            for (let i = triangles.length - 1; i >= 0; i--) {
                let tri = triangles[i];
                let currentTop = parseFloat(tri.style.top) + gameSpeed * deltaTime;
                tri.style.top = currentTop + 'px';

                if (!isShieldActive && currentTop >= 390 && currentTop <= 470 && isJumping) { endGame(); return; }
                if (currentTop > 680) { tri.remove(); triangles.splice(i, 1); score += 20; scoreDisplay.textContent = score; }
            }

            for (let i = blueCircles.length - 1; i >= 0; i--) {
                let circ = blueCircles[i];
                let currentTop = parseFloat(circ.style.top) + gameSpeed * deltaTime;
                circ.style.top = currentTop + 'px';

                if (currentTop >= 380 && currentTop <= 460 && Math.abs(parseFloat(circ.style.left) - (lanes[currentLane] + 7)) < 40) {
                    circ.remove();
                    blueCircles.splice(i, 1);
                    score += 50;
                    scoreDisplay.textContent = score;
                    activateShield();
                    continue;
                }

                if (currentTop > 680) { circ.remove(); blueCircles.splice(i, 1); }
            }

            gameAnimId = requestAnimationFrame(updateGame);
        }

        function endGame() {
            if (isGameOver) return;
            isGameOver = true;

            if (currentBoss) {
                currentBoss.destroy();
                currentBoss = null;
            }

            player.style.backgroundPosition = '0% 100%';
            playerContainer.style.bottom = '90px';
            powerupStatus.style.display = 'none';
            if (gameAnimId) cancelAnimationFrame(gameAnimId);
            
            // === هنا يتم حساب وتحديث أعلى نقاط ===
            let bestScore = checkAndUpdateHighScore(score);

            setTimeout(() => {
                // عرض النقاط الحالية وأعلى نقاط وصلت لها في واجهة الخسارة
                finalScoreDisplay.innerHTML = `النقاط: ${score} <br> <span style="color: #ffcc00; font-size: 15px;">أعلى نقاط: ${bestScore}</span>`;
                gameOverScreen.style.display = 'block';
            }, 1000);
        }

function restartGame() {
document.getElementById('highest-score').textContent = localStorage.getItem('gameHighScore') || 0;

    if (gameAnimId) cancelAnimationFrame(gameAnimId);

    if (currentBoss) {
        currentBoss.destroy();
        currentBoss = null;
    }

    gameSpeed = 450;
    [obstacles, yellowEnemies, triangles, blueCircles].forEach(arr => { arr.forEach(el => el.remove()); arr.length = 0; });
    score = 0; scoreDisplay.textContent = score; currentLane = 1;
    gscore = 0;              // ← أضف هذا السطر
    updateGscoreProgressBar(); // ← أضف هذا السطر لتحديث الشريط فوراً
    spawnAccumulator = yellowSpawnAccumulator = triangleSpawnAccumulator = blueCircleSpawnAccumulator = 0;
            nextYellowSpawnTime = getRandomYellowTime(); nextTriangleSpawnTime = getRandomTriangleTime();
            nextBlueCircleSpawnTime = getRandomBlueCircleTime();
            isShieldActive = false;
            powerupStatus.style.display = 'none';
            player.style.filter = "none";
            animTimer = runFrame = 0; isJumping = isGameOver = false;
            playerContainer.style.bottom = '170px';
            player.style.transform = 'translateY(0)';
            player.style.backgroundPosition = '0% 0%';
            updatePlayerPosition();
            gameOverScreen.style.display = 'none';
            isGameStarted = true; lastTime = performance.now();
            gameAnimId = requestAnimationFrame(updateGame);
        }
        
       function goToStartScreen() {
document.getElementById('highest-score').textContent = localStorage.getItem('gameHighScore') || 0;

    if (gameAnimId) cancelAnimationFrame(gameAnimId);

    if (currentBoss) {
        currentBoss.destroy();
        currentBoss = null;
    }

    [obstacles, yellowEnemies, triangles, blueCircles].forEach(arr => { arr.forEach(el => el.remove()); arr.length = 0; });
    score = 0; scoreDisplay.textContent = score; currentLane = 1;
    gscore = 0;              // ← أضف هذا السطر
    updateGscoreProgressBar(); // ← أضف هذا السطر
    isJumping = isGameOver = isGameStarted = isShieldActive = false;

            powerupStatus.style.display = 'none';
            player.style.filter = "none";
            playerContainer.style.bottom = '170px';
            player.style.transform = 'translateY(0)';
            updatePlayerPosition();
            gameOverScreen.style.display = 'none';
            startScreen.style.display = 'flex';
        }
    </script>
