<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تخصيص الشخصية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
        }

        /* مربع عرض الصورة المدمجة */
        .viewer-box {
            position: relative;
            width: 300px;
            height: 300px;
            border: 3px dashed #ccc;
            border-radius: 8px;
            background-color: #fafafa;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .viewer-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .placeholder-text {
            position: absolute;
            color: #999;
            font-size: 14px;
            z-index: 0;
            text-align: center;
            pointer-events: none;
        }

        /* الأزرار بالأسفل */
        .buttons-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        /* قائمة أزرار الحقول المنفردة: مرتبة عمودياً وقابلة للسحب/التمرير للأعلى والأسفل */
        .row-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-height: 220px; /* الارتفاع الأقصى للقائمة قبل ظهور شريط السحب */
            overflow-y: auto;  /* تفعيل السحب/التمرير العمودي */
            padding-left: 5px;  /* مساحة صغيرة لشريط التمرير */
        }

        .btn {
            width: 100%;
            aspect-ratio: 4 / 1; /* حجم ثابت بنسبة 4 عرض إلى 1 طول */
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: #007bff;
            color: white;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-shrink: 0;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .btn-save {
            background-color: #28a745;
            width: 100%;
            aspect-ratio: auto; /* زر الحفظ يحافظ على حجمه الطبيعي الطبيعي */
            padding: 12px;
            font-size: 16px;
        }

        .btn-save:hover {
            background-color: #218838;
        }

        /* نافذة القوائم المنبثقة (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 350px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 18px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #666;
        }

        .images-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            overflow-y: auto;
            max-height: 300px;
            padding: 5px;
        }

        .images-grid img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border: 2px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.1s;
        }

        .images-grid img:hover {
            transform: scale(1.05);
            border-color: #007bff;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- مربع عرض الصورة المدمجة النهائية -->
        <div class="viewer-box">
            <span id="placeholder" class="placeholder-text">معاينة الصورة هنا</span>
            <img id="final-image" src="" alt="Combined Character">
        </div>

        <!-- أزرار التحكم الديناميكية -->
        <div class="buttons-group">
            <div id="dynamicButtonsRow" class="row-group">
                <!-- سيتم إنشاء أزرار الحقول هنا تلقائياً حسب ملف data_ch.txt -->
            </div>
            <button class="btn btn-save" onclick="saveCombinedImage()">تحميل الصورة بملف</button>
        </div>
    </div>

    <!-- نافذة منبثقة لعرض الصور -->
    <div id="selectionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">اختر صورة</span>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="imagesGrid" class="images-grid">
                <!-- سيتم تعبئة الصور هنا تلقائياً -->
            </div>
        </div>
    </div>

    <script>
        // تخزين الحقول وبياناتها بشكل ديناميكي (ترتيب الإضافة هو ترتيب الطبقات من الأسفل للأعلى)
        let sections = []; // ستحتوي على كائنات مثل: { name: 'character', folder: 'character', images: [...] }

        async function loadData() {
            try {
                const response = await fetch('data_ch.txt');
                const text = await response.text();
                const lines = text.split('\n');

                let currentSec = null;

                for (let line of lines) {
                    line = line.trim();
                    if (!line) continue;

                    // إذا بدأت السطر بعلامة # فهي تعريف لحقل جديد
                    if (line.startsWith('#')) {
                        let rawName = line.substring(1).trim(); // إزالة العلامة #
                        // اسم المجلد سيكون مطابقاً لاسم الحقل (أو يمكنك تخصيصه)
                        currentSec = {
                            key: rawName,
                            folder: rawName,
                            images: []
                        };
                        sections.push(currentSec);
                    } else if (currentSec) {
                        currentSec.images.push(line);
                    }
                }

                buildDynamicButtons();
                loadSavedSelections();

            } catch (error) {
                console.error("خطأ في قراءة ملف data_ch.txt:", error);
                alert("تأكد من وجود ملف data_ch.txt في نفس المجلد!");
            }
        }

        // بناء الأزرار في الواجهة بناءً على الحقول المقروءة من الملف
        function buildDynamicButtons() {
            const rowGroup = document.getElementById('dynamicButtonsRow');
            rowGroup.innerHTML = '';

            sections.forEach(sec => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.textContent = `اختر ${sec.key}`;
                btn.onclick = () => openModal(sec.key);
                rowGroup.appendChild(btn);
            });
        }

        function loadSavedSelections() {
            sections.forEach(sec => {
                let saved = localStorage.getItem(`selected_${sec.key}`);
                if (!saved && sec.images.length > 0) {
                    saved = `${sec.folder}/${sec.images[0]}`;
                    localStorage.setItem(`selected_${sec.key}`, saved);
                }
            });

            updateCombinedView();
        }

        window.onload = loadData;

        function openModal(secKey) {
            const modal = document.getElementById('selectionModal');
            const modalTitle = document.getElementById('modalTitle');
            const imagesGrid = document.getElementById('imagesGrid');
            const targetSec = sections.find(s => s.key === secKey);

            if (!targetSec) return;

            imagesGrid.innerHTML = ''; 
            modalTitle.textContent = `اختر صورة ${targetSec.key}`;

            targetSec.images.forEach(imgName => {
                const imgElement = document.createElement('img');
                imgElement.src = `${targetSec.folder}/${imgName}`;
                imgElement.onclick = () => {
                    localStorage.setItem(`selected_${secKey}`, imgElement.src);
                    updateCombinedView();
                    closeModal();
                };
                imagesGrid.appendChild(imgElement);
            });

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('selectionModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('selectionModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // دالة الدمج الديناميكية: ترسم الحقول بالترتيب من الأعلى للأسفل في الملف (الأسفل يرسم فوق ما سبقه)
        function updateCombinedView() {
            const finalImgElem = document.getElementById('final-image');
            const placeholder = document.getElementById('placeholder');

            // جمع المسارات المحفوظة لكل حقل
            let selections = {};
            let hasAnyImage = false;

            sections.forEach(sec => {
                let val = localStorage.getItem(`selected_${sec.key}`);
                selections[sec.key] = val;
                if (val) hasAnyImage = true;
            });

            if (!hasAnyImage) {
                finalImgElem.src = '';
                placeholder.style.display = 'block';
                return;
            }

            placeholder.style.display = 'none';

            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            let loadedImages = {};
            let totalToLoad = 0;
            let loadedCount = 0;

            sections.forEach(sec => {
                if (selections[sec.key]) {
                    totalToLoad++;
                }
            });

            if (totalToLoad === 0) {
                finalImgElem.src = '';
                placeholder.style.display = 'block';
                return;
            }

            function drawAllLayers() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // الرسم يتم بالتسلسل: الحقل الأول في الملف يُرسَم بالأسفل، وكل حقل تحته في الملف يُرسَم فوقه
                sections.forEach(sec => {
                    if (loadedImages[sec.key]) {
                        ctx.drawImage(loadedImages[sec.key], 0, 0, canvas.width, canvas.height);
                    }
                });

                if (loadedCount === totalToLoad) {
                    finalImgElem.src = canvas.toDataURL('image/png');
                }
            }

            sections.forEach(sec => {
                let src = selections[sec.key];
                if (src) {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.onload = function() {
                        loadedImages[sec.key] = img;
                        loadedCount++;
                        drawAllLayers();
                    };
                    img.src = src;
                }
            });
        }

        function saveCombinedImage() {
            const finalImgElem = document.getElementById('final-image');
            if (!finalImgElem.src) {
                alert("الرجاء اختيار صورة واحدة على الأقل للحفظ!");
                return;
            }

            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let randomPart = '';
            for (let i = 0; i < 7; i++) {
                randomPart += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            const fileName = 'photo_c' + randomPart + '.png';

            const link = document.createElement('a');
            link.download = fileName;
            link.href = finalImgElem.src;
            link.click();
        }
    </script>
</body>
</html>
